name: Build Android APK

# Builds a debug APK of ProCut Studio on every editor change and publishes it
# to a rolling `latest` release, so Saif can always download the newest APK
# from one stable link. Signed with one fixed debug keystore (repo secret ANDROID_DEBUG_KEYSTORE_B64), so every build installs over the previous one.
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "sw.js"
      - "manifest.json"
      - "icon-*.png"
      - "apple-touch-icon.png"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "android/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The editor source of truth is the repo-root web files (index.html etc.).
      # Copy them into www/ on every build so the APK never drifts from main.
      - name: Sync web files into www/
        run: |
          mkdir -p www
          cp index.html sw.js manifest.json icon-192.png icon-512.png apple-touch-icon.png www/

      - name: Sync Capacitor
        run: npx cap sync android

      # One fixed debug keystore for every build (repo secret ANDROID_DEBUG_KEYSTORE_B64).
      # Gradle debug signing otherwise generates a fresh keystore per runner and
      # the update fails with "package conflicts with an existing package".
      # AGP 8.13 reads the debug keystore from ~/.config/.android (alias AndroidDebugKey),
      # not ~/.android -- restore to BOTH paths so every AGP version finds the same key.
      - name: Restore fixed debug keystore
        run: |
          mkdir -p ~/.android ~/.config/.android
          echo "${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}" | base64 -d > ~/.android/debug.keystore
          echo "${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}" | base64 -d > ~/.config/.android/debug.keystore

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug -PversionCode=${{ github.run_number }} --no-daemon

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ProCut-Studio-debug.apk

      - name: Publish to latest release
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: ProCut Studio APK (latest)
          body: |
            Latest debug APK of ProCut Studio, built automatically from main.
            Install on Android: allow "Install unknown apps" for your browser, then open the APK.
          allowUpdates: true
          replacesArtifacts: true
          artifacts: ProCut-Studio-debug.apk
          token: ${{ secrets.GITHUB_TOKEN }}
