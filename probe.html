<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProCut Decoder Probe v3</title>
<style>
  body{background:#101216;color:#e8eef4;font-family:monospace;margin:0;padding:14px;font-size:15px}
  h2{font-family:sans-serif;margin:4px 0 10px}
  #log{white-space:pre-wrap;word-break:break-word;background:#1a1e24;border:1px solid #333c46;border-radius:8px;padding:10px;min-height:200px}
  .ok{color:#7ee2a8}.bad{color:#ff9a9a}.dim{color:#9fb2c3}
  input{font-size:17px;margin:10px 0}
</style>
</head>
<body>
<h2>🔬 ProCut Decoder Probe v3</h2>
<div class="dim">Video file chunein — is dafa editor wala ASLI encoder khol kar us ke sath decoder ka test hoga (D2: encoder khula, D3: encoder chal raha hai). Aakhir mein screenshot bhej dein.</div>
<input type="file" id="fi" accept="video/*">
<div id="log">Tayyar. File ka intezar hai…</div>
<script type="module">
const logEl=document.getElementById("log");
function log(t,cls){const d=document.createElement("div");if(cls)d.className=cls;d.textContent=t;logEl.appendChild(d);window.scrollTo(0,document.body.scrollHeight);}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
log("Browser: "+navigator.userAgent,"dim");

let MP4Box=null;
async function loadBox(){
  if(MP4Box)return MP4Box;
  MP4Box=await import("https://cdn.jsdelivr.net/npm/mp4box@0.5.2/+esm");
  return MP4Box;
}
function findAvcc(u8){
  const regs=[[0,Math.min(u8.length,1048576)],[Math.max(0,u8.length-3145728),u8.length]];
  for(const [a,b] of regs){
    for(let ai=a;ai+8<b;ai++){
      if(u8[ai+4]===0x61&&u8[ai+5]===0x76&&u8[ai+6]===0x63&&u8[ai+7]===0x43){
        const bsz=((u8[ai]<<24)|(u8[ai+1]<<16)|(u8[ai+2]<<8)|u8[ai+3])>>>0;
        if(bsz>10&&bsz<300&&u8[ai+8]===1)return new Uint8Array(u8.buffer.slice(ai+8,ai+bsz));
      }
    }
  }
  return null;
}
async function decodeTest(name, samples, ab, cfg, waitMs){
  log("\n=== TEST "+name+" ===");
  let outs=0, errMsg="";
  const dec=new VideoDecoder({
    output(fr){outs++; fr.close();},
    error(e){errMsg=e.message||String(e);}
  });
  try{dec.configure(cfg); log("decoder configure: OK");}catch(e){log("decoder configure throw: "+e.message,"bad");return 0;}
  const N=Math.min(150,samples.length);
  let fed=0;
  for(let i=0;i<N;i++){
    const sm=samples[i];
    try{dec.decode(new EncodedVideoChunk({type:sm.k?"key":"delta",timestamp:Math.round(sm.t*1e6),duration:Math.round(sm.d*1e6),data:new Uint8Array(ab.slice(sm.o,sm.o+sm.s))})); fed++;}
    catch(e){log("decode() throw @"+i+": "+e.message,"bad");break;}
  }
  log("feed: "+fed+" chunks");
  const t0=performance.now();
  while(performance.now()-t0<waitMs && outs<fed){await sleep(250);}
  log(waitMs/1000+"s tak output: "+outs+(errMsg?" | ERROR: "+errMsg:""));
  try{await dec.flush();}catch(e){}
  log("flush ke baad kul: "+outs);
  try{dec.close();}catch(e){}
  log(outs>0?("TEST "+name+": ✅ "+outs+" frames"):("TEST "+name+": ❌ koi frame nahi"), outs>0?"ok":"bad");
  return outs;
}
/* Editor ki apni encoder ladder (line 3657 se) — jo pehle qabool ho */
const ENC_LADDER=[
  {codec:"avc1.640028",hardwareAcceleration:"prefer-hardware",bm:"constant"},
  {codec:"avc1.640028",hardwareAcceleration:"no-preference",bm:"constant"},
  {codec:"avc1.640028",hardwareAcceleration:"prefer-hardware",bm:"variable"},
  {codec:"avc1.640028",hardwareAcceleration:"no-preference",bm:"variable"}
];
async function makeEditorEncoder(){
  for(let ix=0;ix<ENC_LADDER.length;ix++){
    const e=ENC_LADDER[ix];
    const cfg={codec:e.codec,width:560,height:996,bitrate:830000,bitrateMode:e.bm,framerate:30,hardwareAcceleration:e.hardwareAcceleration,latencyMode:"quality"};
    let sup=null;
    try{sup=await VideoEncoder.isConfigSupported(cfg);}catch(err){}
    if(sup&&sup.supported){
      let encErr="";
      const enc=new VideoEncoder({output(){},error(er){encErr=er.message||String(er);}});
      try{enc.configure(cfg);}catch(err){continue;}
      await sleep(800);
      if(enc.state==="configured"&&!encErr){log("encoder tayyar: seedhi #"+ix+" ("+e.hardwareAcceleration+"/"+e.bm+") state=configured","dim");return enc;}
      log("encoder seedhi #"+ix+" qabool hui lekin band ho gayi: "+(encErr||enc.state),"dim");
      try{enc.close();}catch(err){}
    } else {
      log("encoder seedhi #"+ix+" ("+e.hardwareAcceleration+"/"+e.bm+"): supported nahi","dim");
    }
  }
  return null;
}
document.getElementById("fi").addEventListener("change", async (ev)=>{
  const file=ev.target.files[0]; if(!file)return;
  logEl.textContent="";
  log("File: "+file.name+" ("+(file.size/1048576).toFixed(2)+" MB)");
  const M=await loadBox();
  const ab=await file.arrayBuffer();
  const info=await new Promise((resolve)=>{
    const f=M.createFile();
    f.onReady=resolve; f.onError=()=>resolve(null);
    const b=ab.slice(0); b.fileStart=0; f.appendBuffer(b); f.flush();
    setTimeout(()=>resolve(null),8000);
    window.__pf=f;
  });
  if(!info||!info.videoTracks||!info.videoTracks.length){log("mp4box: video track nahi mila","bad");return;}
  const vt=info.videoTracks[0];
  const raw=window.__pf.getTrackSamplesInfo(vt.id)||[];
  const samples=raw.map(s=>({t:s.cts/s.timescale,d:s.duration/s.timescale,o:s.offset,s:s.size,k:!!s.is_sync}));
  const avcc=findAvcc(new Uint8Array(ab));
  const hx=b=>("0"+(b||0).toString(16)).slice(-2);
  const codecStr="avc1."+hx(avcc[1])+hx(avcc[2])+hx(avcc[3]);
  const cfg={codec:codecStr,description:avcc};
  log("samples: "+samples.length+" | codec: "+codecStr);

  // D2 — editor wala encoder khula (idle), phir decoder
  const enc=await makeEditorEncoder();
  if(!enc){log("koi encoder config nahi chali — D test nahi ho sakta","bad");return;}
  await decodeTest("D2 (encoder khula, idle)", samples, ab, cfg, 6000);

  // D3 — encoder CHAL raha hai (canvas se frame encode kar raha hai), sath decoder
  log("\nencoder ko chalana shuru kar raha hoon…","dim");
  const cv=document.createElement("canvas"); cv.width=560; cv.height=996;
  const cx=cv.getContext("2d");
  let encActive=true, encCount=0;
  const encTimer=setInterval(()=>{
    if(!encActive||enc.state!=="configured")return;
    cx.fillStyle="#"+((encCount*37)%16777215).toString(16).padStart(6,"0"); cx.fillRect(0,0,560,996);
    try{
      const vf=new VideoFrame(cv,{timestamp:encCount*33333,duration:33333});
      enc.encode(vf,{keyFrame:encCount%30===0}); vf.close(); encCount++;
    }catch(e){}
  },40);
  await decodeTest("D3 (encoder chal raha hai)", samples, ab, cfg, 6000);
  encActive=false; clearInterval(encTimer);
  log("encoder ne "+encCount+" frame encode kiye","dim");
  try{enc.close();}catch(e){}

  log("\n🏁 Test mukammal. Is screen ka screenshot bhej dein.","ok");
});
</script>
</body>
</html>
