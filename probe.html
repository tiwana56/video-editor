<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProCut Decoder Probe</title>
<style>
  body{background:#101216;color:#e8eef4;font-family:monospace;margin:0;padding:14px;font-size:15px}
  h2{font-family:sans-serif;margin:4px 0 10px}
  #log{white-space:pre-wrap;word-break:break-word;background:#1a1e24;border:1px solid #333c46;border-radius:8px;padding:10px;min-height:200px}
  .ok{color:#7ee2a8}.bad{color:#ff9a9a}.dim{color:#9fb2c3}
  input{font-size:17px;margin:10px 0}
  button{font-size:17px;padding:10px 16px;border-radius:8px;border:0;background:#2ea36b;color:#fff}
</style>
</head>
<body>
<h2>🔬 ProCut Decoder Probe</h2>
<div class="dim">Video file chunein — do test khud chalenge (A: aam tareeqa, B: annex-B tareeqa). Aakhir mein screenshot bhej dein.</div>
<input type="file" id="fi" accept="video/*">
<div id="log">Tayyar. File ka intezar hai…</div>
<script type="module">
const logEl=document.getElementById("log");
function log(t,cls){const d=document.createElement("div");if(cls)d.className=cls;d.textContent=t;logEl.appendChild(d);window.scrollTo(0,document.body.scrollHeight);}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
log("Browser: "+navigator.userAgent,"dim");

let MP4Box=null;
async function loadBox(){
  if(MP4Box)return MP4Box;
  MP4Box=await import("https://cdn.jsdelivr.net/npm/mp4box@0.5.2/+esm");
  return MP4Box;
}
function findAvcc(u8){
  const regs=[[0,Math.min(u8.length,1048576)],[Math.max(0,u8.length-3145728),u8.length]];
  for(const [a,b] of regs){
    for(let ai=a;ai+8<b;ai++){
      if(u8[ai+4]===0x61&&u8[ai+5]===0x76&&u8[ai+6]===0x63&&u8[ai+7]===0x43){
        const bsz=((u8[ai]<<24)|(u8[ai+1]<<16)|(u8[ai+2]<<8)|u8[ai+3])>>>0;
        if(bsz>10&&bsz<300&&u8[ai+8]===1)return new Uint8Array(u8.buffer.slice(ai+8,ai+bsz));
      }
    }
  }
  return null;
}
function parseAvcc(avcc){
  let p=5; const nSps=avcc[p++]&0x1f, sps=[];
  for(let i=0;i<nSps;i++){const len=(avcc[p]<<8)|avcc[p+1];p+=2;sps.push(avcc.slice(p,p+len));p+=len;}
  const nPps=avcc[p++], pps=[];
  for(let i=0;i<nPps;i++){const len=(avcc[p]<<8)|avcc[p+1];p+=2;pps.push(avcc.slice(p,p+len));p+=len;}
  const ls=(avcc[4]&3)+1;
  return {sps,pps,ls};
}
function toAnnexB(data,ls,extra){
  const parts=[]; let total=0;
  if(extra){for(const e of extra){parts.push(new Uint8Array([0,0,0,1]),e);total+=4+e.length;}}
  let p=0;
  while(p+ls<=data.length){
    let len=0; for(let i=0;i<ls;i++)len=(len<<8)|data[p+i];
    p+=ls;
    if(len<=0||p+len>data.length)break;
    parts.push(new Uint8Array([0,0,0,1]),data.slice(p,p+len));
    total+=4+len; p+=len;
  }
  const out=new Uint8Array(total); let o=0;
  for(const part of parts){out.set(part,o);o+=part.length;}
  return out;
}
async function runTest(name, samples, makeChunk, cfg){
  log("\n=== TEST "+name+" ===");
  try{
    const sup=await VideoDecoder.isConfigSupported(cfg);
    log("config supported: "+(sup&&sup.supported));
    if(!sup||!sup.supported){log("TEST "+name+": config reject — khatam","bad");return;}
  }catch(e){log("isConfigSupported error: "+e.message,"bad");return;}
  let outs=0, firstInfo="", errMsg="";
  const dec=new VideoDecoder({
    output(fr){outs++; if(outs===1)firstInfo="pehla frame: "+fr.displayWidth+"x"+fr.displayHeight+" ts="+fr.timestamp; fr.close();},
    error(e){errMsg=e.message||String(e);}
  });
  try{dec.configure(cfg); log("configure: OK");}catch(e){log("configure throw: "+e.message,"bad");return;}
  const N=Math.min(150,samples.length);
  let fed=0;
  for(let i=0;i<N;i++){
    try{dec.decode(makeChunk(samples[i])); fed++;}
    catch(e){log("decode() throw @"+i+": "+e.message,"bad");break;}
  }
  log("feed: "+fed+" chunks diye, decodeQueueSize="+dec.decodeQueueSize);
  await sleep(5000);
  log("5 second baad output frames: "+outs+(errMsg?" | ERROR: "+errMsg:""));
  if(firstInfo)log(firstInfo);
  try{await dec.flush(); log("flush ke baad kul output: "+outs);}catch(e){log("flush error: "+e.message,"bad");}
  try{dec.close();}catch(e){}
  log(outs>0?("TEST "+name+": ✅ "+outs+" frames aaye"):("TEST "+name+": ❌ koi frame nahi aaya"), outs>0?"ok":"bad");
}
document.getElementById("fi").addEventListener("change", async (ev)=>{
  const file=ev.target.files[0]; if(!file)return;
  logEl.textContent="";
  log("File: "+file.name+" ("+(file.size/1048576).toFixed(2)+" MB)");
  const M=await loadBox();
  const ab=await file.arrayBuffer();
  const info=await new Promise((resolve)=>{
    const f=M.createFile();
    f.onReady=resolve; f.onError=()=>resolve(null);
    const b=ab.slice(0); b.fileStart=0; f.appendBuffer(b); f.flush();
    setTimeout(()=>resolve(null),8000);
    f.__keep=true; window.__pf=f;
  });
  if(!info||!info.videoTracks||!info.videoTracks.length){log("mp4box: video track nahi mila","bad");return;}
  const vt=info.videoTracks[0];
  const raw=window.__pf.getTrackSamplesInfo(vt.id)||[];
  const samples=raw.map(s=>({t:s.cts/s.timescale,d:s.duration/s.timescale,o:s.offset,s:s.size,k:!!s.is_sync}));
  const avcc=findAvcc(new Uint8Array(ab));
  log("samples: "+samples.length+" | pehla keyframe? "+samples[0].k+" | avcC mila? "+(!!avcc));
  if(!avcc){log("avcC nahi mila — test nahi ho sakta","bad");return;}
  const hx=b=>("0"+(b||0).toString(16)).slice(-2);
  const codecStr="avc1."+hx(avcc[1])+hx(avcc[2])+hx(avcc[3]);
  log("codec: "+codecStr);
  // TEST A — description (AVCC) tareeqa, koi hardware pabandi nahi
  await runTest("A (description)", samples,
    sm=>new EncodedVideoChunk({type:sm.k?"key":"delta",timestamp:Math.round(sm.t*1e6),duration:Math.round(sm.d*1e6),data:new Uint8Array(ab.slice(sm.o,sm.o+sm.s))}),
    {codec:codecStr,description:avcc});
  // TEST B — annex-B tareeqa, description ke baghair
  const {sps,pps,ls}=parseAvcc(avcc);
  log("SPS: "+sps.length+" PPS: "+pps.length+" NAL length size: "+ls,"dim");
  await runTest("B (annex-B)", samples,
    sm=>new EncodedVideoChunk({type:sm.k?"key":"delta",timestamp:Math.round(sm.t*1e6),duration:Math.round(sm.d*1e6),data:toAnnexB(new Uint8Array(ab.slice(sm.o,sm.o+sm.s)),ls,sm.k?[...sps,...pps]:null)}),
    {codec:codecStr});
  log("\n🏁 Dono test mukammal. Is screen ka screenshot bhej dein.","ok");
});
</script>
</body>
</html>
